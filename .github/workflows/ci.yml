name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devops
          POSTGRES_PASSWORD: dev-password
          POSTGRES_DB: devops_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devops -d devops_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5


    env:
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: dev-password
      POSTGRES_DB: devops_lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check application
        run: node --check server.js

      - name: Run tests
        run: npm test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags:
            ghcr.io/japiw/devops-lab:latest
            ghcr.io/japiw/devops-lab:${{ github.sha }}
